[project]
name = "benchtop"
version = "0.1.0"
description = "CLI tools to convert instrument files to better formats"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
benchtop = "benchtop.cli:main"

[dependency-groups]
dev = [
    "hatchling>=1.33.0",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
